apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: devops-app-staging
  namespace: argocd

spec:
  project: default
  source:
    repoURL: https://github.com/rdcstr30/devops-project.git
    targetRevision: main
    path: k8s/staging
  destination:
    server: https://kubernetes.default.svc
    namespace: staging
  syncPolicy:
    automated:
      prune: true
      selfHeal: true