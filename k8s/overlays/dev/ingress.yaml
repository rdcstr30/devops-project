apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: devops-app-ingress
  namespace: dev
spec:
  ingressClassName: nginx
  rules:
    - host: 20.233.98.4.nip.io
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: devops-frontend-service
                port:
                  number: 80

          - path: /expenses
            pathType: Prefix
            backend:
              service:
                name: devops-app-service
                port:
                  number: 80

          - path: /health
            pathType: Prefix
            backend:
              service:
                name: devops-app-service
                port:
                  number: 80

          - path: /metrics
            pathType: Prefix
            backend:
              service:
                name: devops-app-service
                port:
                  number: 80
