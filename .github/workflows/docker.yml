name: CI

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.meta.outputs.sha_tag }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set image tag
        id: meta
        run: echo "sha_tag=${{ secrets.DOCKERHUB_USERNAME }}/devops-app:${{ github.sha }}" >> $GITHUB_OUTPUT

      - name: Login to DockerHub
        run: echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u ${{ secrets.DOCKERHUB_USERNAME }} --password-stdin

      - name: Build image
        run: |
          docker build \
            -t ${{ steps.meta.outputs.sha_tag }} \
            -t ${{ secrets.DOCKERHUB_USERNAME }}/devops-app:latest \
            app/api/

      - name: Push image
        run: |
          docker push ${{ steps.meta.outputs.sha_tag }}
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/devops-app:latest

  update-manifests:
    runs-on: ubuntu-latest
    needs: build-and-push

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Update image tag in dev manifest
        run: |
          IMAGE_TAG="${{ needs.build-and-push.outputs.image_tag }}"
          if [ -z "$IMAGE_TAG" ]; then
            echo "ERROR: image_tag is empty, aborting manifest update"
            exit 1
          fi
          sed -i "s|image: rdcstr30/devops-app:.*|image: $IMAGE_TAG|g" \
            k8s/overlays/dev/deployment.yaml

      - name: Commit updated manifest
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add k8s/overlays/dev/deployment.yaml
          git diff --staged --quiet || git commit -m "ci: update dev image to ${{ github.sha }}"
          git push
