name: CI

on:
  push:
    branches: [ main ]
    paths:
      - 'app/**'
      - 'Dockerfile'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.meta.outputs.image_tag }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set image tag
        id: meta
        run: echo "image_tag=${{ vars.ACR_LOGIN_SERVER }}/devops-app:${{ github.sha }}" >> $GITHUB_OUTPUT

      - name: Login to Azure
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Login to ACR
        run: az acr login --name devopsacr3ev7tx

      - name: Build image
        run: |
          docker build \
            -t ${{ steps.meta.outputs.image_tag }} \
            -t ${{ vars.ACR_LOGIN_SERVER }}/devops-app:latest \
            app/api/

      - name: Push image
        run: |
          docker push ${{ steps.meta.outputs.image_tag }}
          docker push ${{ vars.ACR_LOGIN_SERVER }}/devops-app:latest

  update-manifests:
    runs-on: ubuntu-latest
    needs: build-and-push

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Update image tag in dev manifest
        run: |
          IMAGE_TAG="${{ needs.build-and-push.outputs.image_tag }}"
          echo "DEBUG: IMAGE_TAG='$IMAGE_TAG'"
          if [ -z "$IMAGE_TAG" ]; then
            echo "ERROR: image_tag is empty, aborting manifest update"
            exit 1
          fi
          sed -i "s|image: devopsacr3ev7tx.azurecr.io/devops-app:.*|image: $IMAGE_TAG|g" \
            k8s/overlays/dev/deployment.yaml

      - name: Commit updated manifest
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add k8s/overlays/dev/deployment.yaml
          git diff --staged --quiet || git commit -m "ci: update dev image to ${{ github.sha }}"
          git push